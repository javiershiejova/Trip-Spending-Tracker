<style>
/* Layout: one phone-width column of boarding-pass cards; entry happens in a bottom sheet; a fixed "add" button sits over the thumb. */
:root{
  --bg:#0B1020; --surface:#161C31; --ink:#EEF1FA; --muted:#97A0BE; --line:#283050; --chip:#212944;
  --accent:#3F4FF0; --accent-ink:#FFFFFF; --sun:#FFC83D; --sun-ink:#2A1E00;
  --good:#3FCB8F; --bad:#FF6F7D; --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.8);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-size:26px;transform:rotate(-6deg);box-shadow:var(--shadow)}
.brand h1{font-size:30px;font-weight:800;line-height:1}
.tag{font-size:15px;margin:4px 0 22px}

.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--chip);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow);flex:none}

.pass{display:flex;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left;border:0;padding:0;width:100%;transition:transform .15s}
.pass:active{transform:scale(.98)}
.pass .stub{width:78px;flex:none;display:grid;place-items:center;font-size:34px;background:var(--chip);position:relative}
.pass .stub::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed var(--line)}
.pass .body{padding:14px 16px;min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.pass h3{font-size:20px;font-weight:800}
.faces{display:flex}
.face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#17203B;border:2px solid var(--surface);flex:none}
.faces .face+.face{margin-left:-8px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center}
.empty .big{font-size:44px;display:block;margin-bottom:6px}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.topbar h2{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--sun);opacity:.9}
.hero > *{position:relative}
.hero .total{font-family:var(--display);font-size:40px;font-weight:800;line-height:1.05}
.hero .sub{opacity:.85;font-size:14px}
.hero .emoji{position:absolute;right:14px;top:10px;font-size:40px}
.me-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.me-chip{border:0;border-radius:999px;padding:5px 12px 5px 5px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);color:inherit;font-weight:600;font-size:14px}
.me-chip .face{width:24px;height:24px;font-size:13px;border:0}
.me-chip.on{background:var(--sun);color:var(--sun-ink)}
.mybal{margin-top:12px;font-weight:700;font-size:15px}

.tabs{display:flex;gap:2px;margin:18px 0 14px;background:var(--chip);padding:4px;border-radius:999px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 2px;font-weight:700;font-size:13px;color:var(--muted);min-width:0}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.fsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fsel select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;font-size:13px;font-weight:600;min-width:0;width:100%}
.fsel select.on{border-color:var(--accent);color:var(--accent)}
.day{margin:14px 0 6px}
.exp{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;border:0;width:100%;text-align:left;box-shadow:var(--shadow)}
.exp + .exp{margin-top:8px}
.exp .cat{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:22px;flex:none}
.exp .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .amt{font-weight:800;font-family:var(--display);font-size:18px;text-align:right;white-space:nowrap}
.exp .mine{font-size:12px;text-align:right;white-space:nowrap}
.exp.settle{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.bal{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;padding:8px 0}
.bar{height:10px;background:var(--chip);border-radius:99px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.bar.mid::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--line);z-index:1}
.settle-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.settle-row:first-of-type{border-top:0}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:6px 0}
.stat .bar{grid-column:1/-1;height:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover + .b, .chart .b.sel{opacity:.75}
.act{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .ic{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}

.scrim{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:24px;font-weight:800;margin-bottom:14px}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
@keyframes fade{from{opacity:0}}
.noanim{animation:none!important}
.field{display:flex;flex-direction:column;gap:6px}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-width:0}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{resize:vertical;min-height:70px}
.amount-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}
.amount-in{font-family:var(--display);font-size:38px;font-weight:800;text-align:center;padding:10px;border:0;background:var(--surface);border-radius:18px;width:100%;min-width:0}
.amount-in:focus{outline:3px solid var(--accent)}
.cur-sel{border:0;background:var(--surface);border-radius:18px;font-weight:800;font-size:16px;text-align:center;padding:0 6px}
.rate-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.rate-row .input{width:110px;padding:8px 10px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .face{width:22px;height:22px;font-size:12px;border:0}
.chip small{font-weight:700;opacity:.85}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 2px;font-weight:700;font-size:13px;color:var(--muted);min-width:0}
.seg button.on{background:var(--surface);color:var(--ink)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) 92px;gap:10px;align-items:center}
.mrow .input{padding:9px 10px;text-align:right}
.mrow .prev{grid-column:2/-1;font-size:12px;margin-top:-6px;text-align:right}
.item{background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item .r{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center}
.item .input{padding:8px 10px}
.item .who{display:flex;flex-wrap:wrap;gap:6px}
.who button{border:2px solid transparent;border-radius:50%;padding:0;background:none;opacity:.35}
.who button.on{opacity:1;border-color:var(--accent)}
.note{font-size:13px;font-weight:600}
.receipt{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--chip);border:0;padding:0;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px}
.emoji-pick button.on{border-color:var(--accent);background:var(--chip);transform:scale(1.08)}
.person-edit{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.person-edit:first-child{border-top:0}
.linkbox{word-break:break-all;font-size:13px;background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:10px;user-select:all}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(5,8,18,.9);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 10px 30px -8px rgba(58,75,242,.6);padding:15px 26px;font-size:17px}
.fab:active{transform:translateX(-50%) scale(.95)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:90;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.banner{background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* iPhone zooms in on any field with text smaller than 16px; keep every field at 16px or more. */
input:not(.amount-in), select:not(.cur-sel), textarea{font-size:16px}
.fsel select{padding:8px 4px}
/* iPhone gives date fields a fixed minimum width that ignores the layout; let them shrink to their column. */
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:46px;box-sizing:border-box;background:var(--surface)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mini{display:flex;flex-direction:column;gap:4px;min-width:0}

.icon-btn.file-btn{width:48px;height:48px;cursor:pointer}
.sheet-foot{position:sticky;bottom:calc(-12px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:6px 0 4px;margin-top:2px;display:flex;flex-direction:column;gap:6px;z-index:2}
.lightbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lightbox img{max-height:80%}
.logo{background:transparent!important;box-shadow:none!important}

.chip.on .face-btn .face{box-shadow:0 0 0 2px var(--accent-ink)}
.face.xl{width:64px;height:64px;font-size:36px;border:0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}

.setup code{background:var(--chip);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
</style>

function decimals(cur){ try { return new Intl.NumberFormat(undefined,{style:"currency",currency:cur}).resolvedOptions().maximumFractionDigits; } catch { return 2; } }

async function loadTrip(quiet){
  const tid = S.tripId; if (!tid || !CONFIGURED) return;
  if (!quiet){ S.loaded = false; S.loadError = ""; render(); }
  try {
    const c = sb(tid);
    const [t, e, a] = await Promise.all([
      c.from("trips").select("data").eq("id", tid).maybeSingle(),
      c.from("expenses").select("id,data").eq("trip_id", tid).limit(5000),
      c.from("activity").select("id,data,created_at").eq("trip_id", tid).order("created_at", {ascending:false}).limit(150)]);
    if (tid !== S.tripId) return;
    const td = check(t);
    S.trip = td ? {id:tid, ...td.data} : null;
    S.expenses = check(e).map(r => ({id:r.id, ...r.data})).sort((x,y) => (y.createdAt||0)-(x.createdAt||0));
    S.activity = check(a).map(r => ({id:r.id, ...r.data, at: r.data.at || Date.parse(r.created_at)}));
    S.loaded = true; S.loadError = "";
    if (S.trip) rememberTrip(S.trip);
  } catch (err){
    if (tid !== S.tripId) return;
    S.loaded = true; S.loadError = (err && err.message) || "Couldn't reach the database.";
  }
  render();
  if (S.trip && !me() && !draft && !askedWho.has(tid)){ askedWho.add(tid); whoAmISheet(); }
}

/* ---------- money math ---------- */
// Split `total` (integer minor units) in proportion to weights, largest remainder so it always sums exactly.
function allocate(total, w){
  const ids = Object.keys(w).filter(k => w[k] > 0), sumW = ids.reduce((s,k) => s + w[k], 0), out = {};
  if (!ids.length || sumW <= 0) return out;
  let used = 0; const fr = [];
  ids.forEach(k => { const raw = total * w[k] / sumW, fl = Math.floor(raw); out[k] = fl; used += fl; fr.push([k, raw - fl]); });
  fr.sort((a,b) => b[1]-a[1]); for (let i = 0; i < total - used; i++) out[fr[i % fr.length][0]]++;
  return out;
}
function calcSplit(d, t){
  const fE = 10 ** decimals(d.cur), fT = 10 ** decimals(t.currency);
  const amt = parseAmt(d.amount), totalE = Math.round(amt * fE);
  const rate = d.cur === t.currency ? 1 : parseAmt(d.rate);
  const totalT = Math.round(amt * rate * fT);
  const ids = (t.people||[]).map(p => p.id), w = {}; let err = "", status = "";
  if (d.mode === "equal"){
    d.among.forEach(id => { if (ids.includes(id)) w[id] = 1; });
    const n = Object.keys(w).length; if (!n) err = "Pick at least one person to split with."; else status = n === 1 ? "One person pays it all" : `${n}-way split`;
  } else if (d.mode === "exact"){
    let sum = 0; ids.forEach(id => { const m = Math.round(parseAmt(d.exact[id]) * fE); if (m > 0){ w[id] = m; sum += m; } });
    const left = totalE - sum;
    if (!left) status = "Adds up perfectly ✔"; else err = left > 0 ? `${fmt(left/fE, d.cur)} left to assign` : `${fmt(-left/fE, d.cur)} over the total`;
  } else if (d.mode === "percent"){
    let sum = 0; ids.forEach(id => { const p = parseAmt(d.percent[id]); if (p > 0){ w[id] = p; sum += p; } });
    const left = round(100 - sum, 3);
    if (Math.abs(left) < 0.01) status = "100% ✔"; else err = left > 0 ? `${round(left,2)}% left to assign` : `${round(-left,2)}% too much`;
  } else if (d.mode === "shares"){
    let sum = 0; ids.forEach(id => { const p = parseAmt(d.shareN[id]); if (p > 0){ w[id] = p; sum += p; } });
    if (!sum) err = "Give at least one person a share."; else status = `${round(sum,2)} share${sum===1?"":"s"} in total`;
  } else if (d.mode === "items"){
    let sumI = 0;
    for (const it of d.items){ const m = Math.round(parseAmt(it.amount) * fE); if (m <= 0) continue;
      const ws = it.who.filter(id => ids.includes(id)); if (!ws.length){ err = `Pick who had “${it.name || "an item"}”.`; break; }
      sumI += m; ws.forEach(id => w[id] = (w[id]||0) + m / ws.length); }
    if (!err){
      if (!sumI) err = "Add at least one item with a price.";
      else if (sumI > totalE) err = `Items add up to ${fmt(sumI/fE, d.cur)}, more than the total.`;
      else { const rem = totalE - sumI; status = rem ? `Items ${fmt(sumI/fE, d.cur)} + ${fmt(rem/fE, d.cur)} tax/tip, shared in proportion` : "Items add up to the total ✔"; }
    }
  }
  return { err, status, prevE: allocate(totalE, w), sharesT: allocate(totalT, w), totalE, totalT, fE, fT, rate };
}
function balances(t, exps){
  const f = 10 ** decimals(t.currency), net = {};
  (t.people||[]).forEach(p => net[p.id] = 0);
  for (const e of exps){
    net[e.payer] = (net[e.payer]||0) + Math.round(e.amount * f);
    for (const [id, v] of Object.entries(e.shares||{})) net[id] = (net[id]||0) - Math.round(v * f);
  }
  return {net, f};
}
function settlePlan(net){
  const cred = [], debt = [];
  for (const [id, v] of Object.entries(net)){ if (v > 0) cred.push({id, v}); else if (v < 0) debt.push({id, v:-v}); }
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  const plan = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length){
    const m = Math.min(debt[i].v, cred[j].v);
    if (m > 0) plan.push({from:debt[i].id, to:cred[j].id, v:m});
    debt[i].v -= m; cred[j].v -= m;
    if (!debt[i].v) i++; if (!cred[j].v) j++;
  }
  return plan;
}
const MODE_LABEL = {exact:"exact split", percent:"split by %", shares:"split by shares", items:"itemized"};
function splitLabel(e){ const n = Object.keys(e.shares||{}).length;
  return MODE_LABEL[e.mode] ? `${MODE_LABEL[e.mode]} · ${n} ${n===1?"person":"people"}` : `split ${n} way${n===1?"":"s"}`; }

  if (id !== S.tripId){
    stopLive(); S.tripId = id; S.trip = null; S.expenses = []; S.activity = []; S.loaded = false;

}

}

function filtered(t, exps){
  const q = S.q.trim().toLowerCase();
  return exps.filter(e => {
    if (S.fCat && (e.type === "settle" || e.cat !== S.fCat)) return false;
    if (S.fMethod && e.method !== S.fMethod) return false;
    if (S.fWho && e.payer !== S.fWho && !(e.shares||{})[S.fWho]) return false;
    if (!q) return true;
    const hay = [e.desc, e.notes, e.method, cat(e.cat).l, person(t, e.payer).name, e.cur, String(e.amount), String(e.origAmount ?? ""),
      ...(e.inputs && e.inputs.items ? e.inputs.items.map(i => i.name) : []), e.type === "settle" ? "settle pay back" : ""].join(" ").toLowerCase();
    return hay.includes(q);
  });
}
function expensesTab(t, exps, m){

  return `<div class="filters">
      <input class="input" id="q" type="search" placeholder="🔍 Search expenses, notes, items…" value="${esc(S.q)}" autocomplete="off">
      <div class="fsel">
        <select id="f-cat" class="${S.fCat?"on":""}" aria-label="Filter by category"><option value="">All categories</option>${CATS.map(c => `<option value="${c.k}" ${S.fCat===c.k?"selected":""}>${c.e} ${c.l}</option>`).join("")}</select>
        <select id="f-who" class="${S.fWho?"on":""}" aria-label="Filter by person"><option value="">Everyone</option>${(t.people||[]).map(p => `<option value="${esc(p.id)}" ${S.fWho===p.id?"selected":""}>${esc(p.emoji)} ${esc(p.name)}</option>`).join("")}</select>
        <select id="f-method" class="${S.fMethod?"on":""}" aria-label="Filter by payment method"><option value="">All methods</option>${methods.map(x => `<option ${S.fMethod===x?"selected":""}>${esc(x)}</option>`).join("")}</select>
      </div>
    </div>

}
function expList(t, exps, m){
  const list = filtered(t, exps), isF = S.q || S.fCat || S.fWho || S.fMethod;
  let head = "";
  if (isF){ const sum = list.filter(e => e.type !== "settle").reduce((s,e) => s + e.amount, 0);
    head = `<div class="row" style="margin-top:8px"><span class="note grow">${list.length} match${list.length===1?"":"es"} · ${fmt(sum, t.currency)}</span><button class="btn sm ghost" data-act="clear-filters">Clear</button></div>`; }
  if (!list.length) return head + `<div class="empty" style="margin-top:10px"><span class="big">🔎</span><b>Nothing matches</b><p class="muted">Try another word or clear the filters.</p></div>`;
  const byDay = {};
  [...list].sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0)).forEach(e => (byDay[e.date||""] ||= []).push(e));
  return head + Object.entries(byDay).map(([d, items]) => {
    const dayTotal = items.filter(e=>e.type!=="settle").reduce((s,e)=>s+e.amount,0);
    return `<div class="row day"><span class="label grow">${esc(niceDate(d))}</span><span class="label num">${dayTotal ? fmt(dayTotal, t.currency) : ""}</span></div>` +
    items.map(e => {
      const payer = person(t, e.payer);
      if (e.type === "settle"){
        const to = person(t, Object.keys(e.shares||{})[0]);
        return `<button class="exp settle" data-act="edit" data-id="${esc(e.id)}"><span class="cat">🤝</span><span class="grow"><div class="t">${esc(payer.name)} paid back ${esc(to.name)}</div><div class="m">${esc(e.method||"")}</div></span><span class="amt num">${fmt(e.amount, t.currency)}</span></button>`;
      }
      const c = cat(e.cat);
      let mine = "";

function niceMax(v){ if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); for (const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p; return 10*p; }
function dailyChart(t, real){
  const m = {}; real.forEach(e => { if (e.date) m[e.date] = (m[e.date]||0) + e.amount; });
  const keys = Object.keys(m).sort(); if (keys.length < 2) return "";
  const all = []; const d = new Date(keys[0]+"T12:00:00"), end = new Date(keys[keys.length-1]+"T12:00:00");
  while (d <= end && all.length < 1000){ all.push(iso(d)); d.setDate(d.getDate()+1); }
  const days = all.slice(-31), W = 340, H = 170, L = 4, R = 4, T = 22, B = 22, pw = W-L-R, ph = H-T-B;
  const top = niceMax(Math.max(...days.map(k => m[k]||0))), slot = pw / days.length, bw = Math.max(2, Math.min(26, slot - 2));
  const y = v => T + ph - v/top*ph;
  let svg = `<line x1="${L}" x2="${W-R}" y1="${y(top)}" y2="${y(top)}" style="stroke:var(--line)" stroke-dasharray="3 3"/>
    <line x1="${L}" x2="${W-R}" y1="${y(top/2)}" y2="${y(top/2)}" style="stroke:var(--line)" stroke-dasharray="3 3"/>
    <text x="${L}" y="${y(top)-5}" font-size="11" style="fill:var(--muted)">${esc(fmt(top, t.currency))}</text>
    <text x="${L}" y="${y(top/2)-5}" font-size="11" style="fill:var(--muted)">${esc(fmt(top/2, t.currency))}</text>`;
  days.forEach((k, i) => { const v = m[k]||0, x = L + i*slot + (slot-bw)/2, yb = T + ph, h = yb - y(v), r = Math.min(4, bw/2, h);
    const label = `${niceDate(k)} · ${fmt(v, t.currency)}`;
    svg += `<rect class="hit" x="${L+i*slot}" y="${T}" width="${slot}" height="${ph+B}" data-act="bar" data-label="${esc(label)}" data-i="${i}"><title>${esc(label)}</title></rect>`;
    if (h > 0) svg += `<path class="b" data-bi="${i}" style="fill:var(--accent);pointer-events:none" d="M${x},${yb} V${yb-h+r} Q${x},${yb-h} ${x+r},${yb-h} H${x+bw-r} Q${x+bw},${yb-h} ${x+bw},${yb-h+r} V${yb} Z"/>`; });
  svg += `<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" style="stroke:var(--muted)" stroke-width="1"/>
    <text x="${L}" y="${H-5}" font-size="11" style="fill:var(--muted)">${esc(new Date(days[0]+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}))}</text>
    <text x="${W-R}" y="${H-5}" font-size="11" text-anchor="end" style="fill:var(--muted)">${esc(new Date(days[days.length-1]+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}))}</text>`;
  return `<div class="card chart"><div class="row" style="margin-bottom:6px"><span class="label grow">Daily spend${all.length > 31 ? " · last 31 days" : ""}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spend bar chart">${svg}</svg>
    <div class="note muted num" id="chart-cap" style="margin-top:6px">Tap a bar to see that day's total.</div></div>`;
}

function refreshSplit(){

}
function prefillMode(mode){
  const t = trip(), d = draft, ids = (t.people||[]).map(p=>p.id), base = [...d.among].filter(id => ids.includes(id));
  const among = base.length ? base : ids;
  if (mode === "exact" && !Object.values(d.exact).some(v => parseAmt(v))){
    const r = calcSplit({...d, mode:"equal", among:new Set(among)}, t); d.exact = {};
    for (const [id, v] of Object.entries(r.prevE)) d.exact[id] = String(v / r.fE);
  }
  if (mode === "percent" && !Object.values(d.percent).some(v => parseAmt(v))){
    d.percent = {}; const n = among.length, each = Math.floor(10000 / n) / 100;
    among.forEach((id, i) => d.percent[id] = String(i === n-1 ? round(100 - each*(n-1), 2) : each));
  }
  if (mode === "shares" && !Object.values(d.shareN).some(v => parseAmt(v))){ d.shareN = {}; among.forEach(id => d.shareN[id] = "1"); }
  if (mode === "items" && !d.items.length) d.items = [{name:"", amount:"", who:[...ids]}];
}

/* ---------- receipts ---------- */
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    return blob || file;
  } catch { return file; }
}
async function onReceiptFile(file){
  if (!file || !draft) return;
  syncExpDraft();
  const my = draft, blob = await shrink(file);
  if (my.receiptUrl && my.receiptUrl.startsWith("blob:")) URL.revokeObjectURL(my.receiptUrl);
  my.receiptUrl = URL.createObjectURL(blob); my.receipt = null; my.uploading = true;
  if (draft === my) renderExpenseSheet();
  const type = ["image/jpeg","image/png","image/webp"].includes(blob.type) ? blob.type : "image/jpeg";
  const path = `${S.tripId}/${newId(16)}.${type.split("/")[1].replace("jpeg","jpg")}`;
  try { check(await sb(S.tripId).storage.from("receipts").upload(path, blob, {contentType:type, upsert:false})); my.receipt = path; }
  catch (e){ console.error(e); toast("Couldn't upload the photo. Check your connection."); }
  my.uploading = false; if (draft === my) renderExpenseSheet();
}

function buildCSV(t, exps){
  const q = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const people = t.people || [];
  const head = ["Date","Type","Description","Category","Paid by","Payment method",`Amount (${t.currency})`,"Original amount","Original currency","Exchange rate","Split type",...people.map(p => `${p.name} share (${t.currency})`),"Items","Notes","Receipt photo"];
  const rows = [...exps].sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0)).map(e => {
    const settle = e.type === "settle";
    return [e.date, settle ? "Pay-back" : "Expense", settle ? `${person(t,e.payer).name} paid back ${person(t, Object.keys(e.shares||{})[0]).name}` : e.desc, settle ? "" : cat(e.cat).l,
      person(t, e.payer).name, e.method, e.amount, e.origAmount ?? e.amount, e.cur || t.currency, e.rate ?? 1, settle ? "" : (e.mode || "equal"),
      ...people.map(p => (e.shares||{})[p.id] ?? ""), (e.inputs && e.inputs.items || []).map(i => `${i.name}: ${i.amount}`).join("; "), e.notes || "", e.receipt ? receiptUrl(e.receipt) : ""];
  });
  return [head, ...rows].map(r => r.map(q).join(",")).join("\r\n");
}
function exportCSV(){
  const t = trip(), csv = buildCSV(t, S.expenses), name = (t.name.replace(/[^\w\- ]+/g, "").trim() || "trip") + " expenses.csv";
  const url = URL.createObjectURL(new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast("Exported 📄");
}
async function copyText(text, el){

}

      amountT = amtE / fT; shares = {[to]: amountT};
    } else {
      const r = calcSplit(d, t);
      if (r.err){ d.view = "split"; renderExpenseSheet(); const sh = $(".sheet"); if (sh) sh.scrollTop = 0; return; }
      amountT = r.totalT / fT; shares = {}; for (const [id, v] of Object.entries(r.sharesT)) shares[id] = v / fT;
      if (d.mode === "equal") inputs.among = [...d.among];
      if (d.mode === "exact") inputs.exact = d.exact;
      if (d.mode === "percent") inputs.percent = d.percent;
      if (d.mode === "shares") inputs.shares = d.shareN;
      if (d.mode === "items") inputs.items = d.items.filter(i => parseAmt(i.amount) > 0 || i.name.trim());
    }
    const prev = S.expenses.find(e => e.id === d.id);
    const body = { type:d.type, amount:amountT, origAmount:amtE / fE, cur:d.cur, rate, desc:(d.desc||"").trim(), cat:d.cat, payer:d.payer, method:d.method,
      mode: settle ? "exact" : d.mode, inputs, shares, notes:(d.notes||"").trim(), receipt:d.receipt || null, date:d.date || today(),
      createdAt:(prev && prev.createdAt) || Date.now(), createdBy:(prev ? prev.createdBy : me()) || null, updatedBy:me() || null, updatedAt:Date.now() };
    const isNew = !d.id, id = d.id || newId();
    lsSet("ww-lastcur-" + t.id, foreign ? d.cur : "");
    closeSheet();
    const label = settle ? "a pay-back" : (body.desc || cat(body.cat).l);
    const money = fmt(amountT, t.currency) + (foreign ? ` (${fmt(body.origAmount, body.cur)})` : "");
    const ok = await write(async () => {
        await putExpense(id, body);
        if (foreign && String((t.rates||{})[d.cur]) !== String(rate)) await patchTrip({rates:{[d.cur]: rate}}).catch(() => {});
      }, isNew ? CHEERS[Math.floor(Math.random()*CHEERS.length)] : "Updated ✏️", [t.id, isNew ? "add" : "edit", `${isNew ? "added" : "edited"} ${label} · ${money}`]);
    if (ok && isNew){ S.tab = "expenses"; render(); confetti(); }
    return;
  }
  if (form === "add-person"){ const v = $("#new-person").value.trim(); if (!v) return;
    const people = [...(t.people||[]), makePerson(v, (t.people||[]).length)];
    await write(() => patchTrip({people}), `${v} joined the trip 👋`, [t.id, "people", `added ${v} to the trip`]); return; }
  if (form === "add-method"){ const v = $("#new-method").value.trim(); if (!v) return;
    await write(() => patchTrip({methods:[...(t.methods||[]), v]}), "Method added"); return; }
  if (form === "rates"){ const rates = {};
    ev.target.querySelectorAll("[data-rate]").forEach(i => { const r = parseAmt(i.value); if (r > 0) rates[i.dataset.rate] = r; });
    await write(() => patchTrip({rates}), "Rates saved 💱", [t.id, "trip", "updated exchange rates"]); return; }
  if (form === "trip-details"){ const name = $("#trip-name-edit").value.trim(), currency = $("#trip-cur-edit").value; if (!name) return;
    await write(() => patchTrip({name, currency}), "Saved", [t.id, "trip", "updated the trip details"]); return; }
});

/* ---------- confetti ---------- */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false; const x = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#FFC83D","#3A4BF2","#FF8FA3","#4CD39A","#8B96FF","#FFB4A2"];
  const ps = Array.from({length:90}, () => ({x:W/2, y:H*0.85, vx:(Math.random()-.5)*14, vy:-(Math.random()*14+8), r:Math.random()*6+4, c:cols[Math.random()*cols.length|0], a:Math.random()*6, s:(Math.random()-.5)*.4}));
  let n = 0;
  (function tick(){ x.clearRect(0,0,W,H);
    ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += p.s; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if (++n < 90) requestAnimationFrame(tick); else { x.clearRect(0,0,W,H); c.hidden = true; } })();
}

readHash(); render();
</script>
