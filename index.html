<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Layout: one phone-width column of boarding-pass cards; entry happens in a bottom sheet; a fixed "add" button sits over the thumb. */
:root{
  --bg:#0B1020; --surface:#161C31; --ink:#EEF1FA; --muted:#97A0BE; --line:#283050; --chip:#212944;
  --accent:#3F4FF0; --accent-ink:#FFFFFF; --sun:#FFC83D; --sun-ink:#2A1E00;
  --good:#3FCB8F; --bad:#FF6F7D; --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.8);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; color-scheme:dark;
}

:root[data-theme="light"]{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#141A2E; --muted:#59617E; --line:#DDE1EC; --chip:#E8EBF3;
  --accent:#3F4FF0; --accent-ink:#FFFFFF; --sun:#FFC83D; --sun-ink:#3A2A00;
  --good:#11895A; --bad:#D23D4B; --shadow:0 1px 0 rgba(20,26,46,.05),0 8px 24px -12px rgba(20,26,46,.25); color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-size:26px;transform:rotate(-6deg);box-shadow:var(--shadow)}
.brand h1{font-size:30px;font-weight:800;line-height:1}
.tag{font-size:15px;margin:4px 0 22px}

.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--chip);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow);flex:none}

.pass{display:flex;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left;border:0;padding:0;width:100%;transition:transform .15s}
.pass:active{transform:scale(.98)}
.pass .stub{width:78px;flex:none;display:grid;place-items:center;font-size:34px;background:var(--chip);position:relative}
.pass .stub::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed var(--line)}
.pass .body{padding:14px 16px;min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.pass h3{font-size:20px;font-weight:800}
.faces{display:flex}
.face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#17203B;border:2px solid var(--surface);flex:none}
.faces .face+.face{margin-left:-8px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center}
.empty .big{font-size:44px;display:block;margin-bottom:6px}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.topbar h2{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--sun);opacity:.9}
.hero > *{position:relative}
.hero .total{font-family:var(--display);font-size:40px;font-weight:800;line-height:1.05}
.hero .sub{opacity:.85;font-size:14px}
.hero .emoji{position:absolute;right:14px;top:10px;font-size:40px}
.me-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.me-chip{border:0;border-radius:999px;padding:5px 12px 5px 5px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);color:inherit;font-weight:600;font-size:14px}
.me-chip .face{width:24px;height:24px;font-size:13px;border:0}
.me-chip.on{background:var(--sun);color:var(--sun-ink)}
.mybal{margin-top:12px;font-weight:700;font-size:15px}

.tabs{display:flex;gap:2px;margin:18px 0 14px;background:var(--chip);padding:4px;border-radius:999px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 2px;font-weight:700;font-size:13px;color:var(--muted);min-width:0}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.fsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fsel select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;font-size:13px;font-weight:600;min-width:0;width:100%}
.fsel select.on{border-color:var(--accent);color:var(--accent)}
.day{margin:14px 0 6px}
.exp{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;border:0;width:100%;text-align:left;box-shadow:var(--shadow)}
.exp + .exp{margin-top:8px}
.exp .cat{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:22px;flex:none}
.exp .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .amt{font-weight:800;font-family:var(--display);font-size:18px;text-align:right;white-space:nowrap}
.exp .mine{font-size:12px;text-align:right;white-space:nowrap}
.exp.settle{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.bal{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;padding:8px 0}
.bar{height:10px;background:var(--chip);border-radius:99px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.bar.mid::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--line);z-index:1}
.settle-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.settle-row:first-of-type{border-top:0}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:6px 0}
.stat .bar{grid-column:1/-1;height:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover + .b, .chart .b.sel{opacity:.75}
.act{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .ic{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}

.scrim{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:24px;font-weight:800;margin-bottom:14px}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
@keyframes fade{from{opacity:0}}
.noanim{animation:none!important}
.field{display:flex;flex-direction:column;gap:6px}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-width:0}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{resize:vertical;min-height:70px}
.amount-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}
.amount-in{font-family:var(--display);font-size:38px;font-weight:800;text-align:center;padding:10px;border:0;background:var(--surface);border-radius:18px;width:100%;min-width:0}
.amount-in:focus{outline:3px solid var(--accent)}
.cur-sel{border:0;background:var(--surface);border-radius:18px;font-weight:800;font-size:16px;text-align:center;padding:0 6px}
.rate-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.rate-row .input{width:110px;padding:8px 10px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .face{width:22px;height:22px;font-size:12px;border:0}
.chip small{font-weight:700;opacity:.85}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 2px;font-weight:700;font-size:13px;color:var(--muted);min-width:0}
.seg button.on{background:var(--surface);color:var(--ink)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) 92px;gap:10px;align-items:center}
.mrow .input{padding:9px 10px;text-align:right}
.mrow .prev{grid-column:2/-1;font-size:12px;margin-top:-6px;text-align:right}
.item{background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item .r{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center}
.item .input{padding:8px 10px}
.item .who{display:flex;flex-wrap:wrap;gap:6px}
.who button{border:2px solid transparent;border-radius:50%;padding:0;background:none;opacity:.35}
.who button.on{opacity:1;border-color:var(--accent)}
.note{font-size:13px;font-weight:600}
.receipt{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--chip);border:0;padding:0;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px}
.emoji-pick button.on{border-color:var(--accent);background:var(--chip);transform:scale(1.08)}
.person-edit{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.person-edit:first-child{border-top:0}
.linkbox{word-break:break-all;font-size:13px;background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:10px;user-select:all}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(5,8,18,.9);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 10px 30px -8px rgba(58,75,242,.6);padding:15px 26px;font-size:17px}
.fab:active{transform:translateX(-50%) scale(.95)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:90;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.banner{background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* iPhone zooms in on any field with text smaller than 16px; keep every field at 16px or more. */
input:not(.amount-in), select:not(.cur-sel), textarea{font-size:16px}
.fsel select{padding:8px 4px}
/* iPhone gives date fields a fixed minimum width that ignores the layout; let them shrink to their column. */
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:46px;box-sizing:border-box;background:var(--surface)}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
.xform{display:flex;flex-direction:column;gap:8px}
.sheet{max-height:96%;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet .rate-row .input{padding:6px 10px}
.sheet .grab{margin-bottom:8px}
.grid2 > .input{padding:10px 12px;width:100%;min-width:0}
.xs-head{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sheet .xs-head h2{font-size:22px;margin:0}
.sheet .amount-in{font-size:30px;padding:4px 6px}
.sheet .amount-row{grid-template-columns:minmax(0,1fr) 92px}
.catrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0}
.catrow::-webkit-scrollbar{display:none}
.catrow .chip{flex:none;padding:6px 11px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mini{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini .input{padding:10px 12px;width:100%}
.split-btn{display:flex;align-items:center;gap:6px;text-align:left;font-weight:600;font-size:14px;cursor:pointer;min-height:46px}
.split-btn .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-btn.bad{border-color:var(--bad);color:var(--bad)}
.thumb.sm{width:48px;height:48px;position:relative;cursor:pointer}
.thumb-busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,30,.45);border-radius:10px}
.icon-btn.file-btn{width:48px;height:48px;cursor:pointer}
.sheet-foot{position:sticky;bottom:calc(-12px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:6px 0 4px;margin-top:2px;display:flex;flex-direction:column;gap:6px;z-index:2}
.lightbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lightbox img{max-height:80%}
.logo{background:transparent!important;box-shadow:none!important}
.logo img{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(23,32,59,.25))}
.face-btn{border:0;background:none;padding:0;display:inline-grid;cursor:pointer;position:relative;color:inherit}
.face-btn .pen{position:absolute;right:-6px;bottom:-4px;font-size:11px;background:var(--surface);border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
.chip.on .face-btn .face{box-shadow:0 0 0 2px var(--accent-ink)}
.face.xl{width:64px;height:64px;font-size:36px;border:0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}
.sw.on{border-color:var(--ink);transform:scale(1.1)}
.brand .theme-btn{margin-left:auto}
details.arch{background:var(--surface);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
details.arch summary{cursor:pointer;font-weight:700;color:var(--muted)}
.bud-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 84px;align-items:center;gap:6px;font-size:14px;font-weight:600}
.brow .input{padding:8px 8px;text-align:right}
@media (max-width:440px){.bud-grid{grid-template-columns:1fr}}
.qrow{display:flex;align-items:center;gap:6px}
.qbtn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:0;border-radius:14px;padding:10px 12px;min-width:0;box-shadow:var(--shadow)}
.qbtn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.sm{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:18px;flex:none}
.xs-head .icon-btn{flex:none}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
:root:not([data-theme="light"]) .linkish{color:#9AA5FF}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:85;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);padding:8px 8px 8px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
.desk-only{display:none}
.trip-grid{display:flex;flex-direction:column;gap:12px}
@media (hover:hover){ .exp:hover,.pass:hover,.qbtn:hover{filter:brightness(1.06)} .btn:hover{filter:brightness(1.08)} }
@media (min-width:720px){
  .wrap{max-width:720px}
  .trip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .trip-grid > .empty{grid-column:1/-1}
  /* bottom sheets become centred windows */
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:24px;max-height:min(88vh,900px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  .sheet .grab{display:none}
  .catrow{flex-wrap:wrap;overflow:visible}
  .sheet-foot{bottom:-12px}
}
/* iPad portrait and up: balances panel beside the list */
@media (min-width:800px){
  .wrap{max-width:1160px;padding-block:28px 60px}
  .trip-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
  .trip-side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
  .trip-main .tabs{margin-top:0}
  .desk-only{display:block}
  .trip-side .hero::before{width:100px;height:100px;right:-34px;top:-34px}
  .trip-side .hero .emoji{font-size:32px;right:12px;top:8px}
  .fab{left:auto;right:max(28px,calc((100vw - 1160px)/2));transform:none;bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .fab:active{transform:scale(.95)}
  .tag{max-width:60ch}
}
/* iPad landscape and computers */
@media (min-width:1000px){
  .wrap{padding-block:32px 60px}
  .trip-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .trip-layout{grid-template-columns:360px minmax(0,1fr);gap:28px}
  .brand h1{font-size:36px}
}

function compose(){
  const tid = S.tripId; if (!tid) return;
  const v = applyOps(base[tid] || {trip:null, expenses:[], activity:[]}, pendingFor(tid));
  S.trip = v.trip; S.expenses = v.expenses.filter(e => !e.deletedAt); S.trash = v.expenses.filter(e => e.deletedAt); S.activity = v.activity; S.pending = pendingFor(tid).filter(o => o.kind !== "activity").length;
  if (S.trip) rememberTrip(S.trip);
}
async function loadTrip(quiet){
  const tid = S.tripId; if (!tid || !CONFIGURED) return;
  if (!base[tid]){ const c = readCache(tid); if (c){ base[tid] = c; S.loaded = true; } }
  if (!quiet){ S.loadError = ""; compose(); render(); }
  try {
    const c = sb(tid);
    const [t, e, a] = await Promise.all([
      c.from("trips").select("data").eq("id", tid).maybeSingle(),
      c.from("expenses").select("id,data").eq("trip_id", tid).limit(5000),
      c.from("activity").select("id,data,created_at").eq("trip_id", tid).order("created_at", {ascending:false}).limit(150)]);
    const td = check(t);
    const snap = { trip: td ? {id:tid, ...td.data} : null,
      expenses: check(e).map(r => ({id:r.id, ...r.data})),
      activity: check(a).map(r => ({id:r.id, ...r.data, at: r.data.at || Date.parse(r.created_at)})) };
    base[tid] = snap; writeCache(tid, snap);
    const old = snap.expenses.filter(e => e.deletedAt && Date.now() - e.deletedAt > 30 * 864e5 && !pendingFor(tid).some(o => o.id === e.id));
    if (old.length && tid === S.tripId) setTimeout(() => write(old.map(e => delExpense(e.id))), 0);   // bin keeps things 30 days
    if (tid === S.tripId){ S.offline = false; S.loadError = ""; }
  } catch (err){
    if (tid !== S.tripId) return;
    S.offline = isNetErr(err); S.loadError = (err && err.message) || "Couldn't reach the database.";
  }
  if (tid !== S.tripId) return;
  S.loaded = true; compose(); render();
  if (S.trip && !me() && !draft && !askedWho.has(tid)){ askedWho.add(tid); whoAmISheet(); }
}
const askedWho = new Set();
function startLive(){
  stopLive(); if (!S.tripId || !CONFIGURED) return;
  try {
    channel = sb(S.tripId).channel("trip-" + S.tripId, {config:{broadcast:{self:false}}})
      .on("broadcast", {event:"changed"}, () => loadTrip(true)).subscribe();
  } catch {}
  pollTimer = setInterval(() => { if (document.visibilityState === "visible"){ flush(); loadTrip(true); } }, 30000);
}
function stopLive(){ if (channel){ try { sb(S.tripId || "x").removeChannel(channel); } catch {} channel = null; } if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function ping(){ if (channel) channel.send({type:"broadcast", event:"changed", payload:{at:Date.now()}}).catch(() => {}); }

// Change builders (nothing is sent until flush)
function putTrip(tid, data){ return {kind:"putTrip", tid, data}; }
function patchTrip(patch){ return {kind:"patchTrip", tid:S.tripId, patch}; }
function putExpense(id, body){ return {kind:"putExpense", tid:S.tripId, id, body}; }
function delExpense(id){ return {kind:"delExpense", tid:S.tripId, id}; }
function logOp(tid, action, text){ return {kind:"activity", tid, id:newId(), data:{at:Date.now(), who:lsGet("ww-me-" + tid) || null, action, text}}; }
async function runOp(o){
  const c = sb(o.tid);
  if (o.kind === "putTrip") check(await c.from("trips").upsert({id:o.tid, data:o.data, updated_at:new Date().toISOString()}));
  else if (o.kind === "patchTrip"){
    const cur = check(await c.from("trips").select("data").eq("id", o.tid).maybeSingle());
    if (!cur) return; // trip was deleted
    const data = {...cur.data, ...o.patch};
    if (o.patch.rates) data.rates = {...(cur.data.rates || {}), ...o.patch.rates};
    check(await c.from("trips").upsert({id:o.tid, data, updated_at:new Date().toISOString()}));
  }
  else if (o.kind === "putExpense") check(await c.from("expenses").upsert({id:o.id, trip_id:o.tid, data:o.body}));
  else if (o.kind === "delExpense") check(await c.from("expenses").delete().eq("id", o.id));
  else if (o.kind === "activity") check(await c.from("activity").upsert({id:o.id, trip_id:o.tid, data:o.data}));
}
async function flush(){
  if (flushing || !CONFIGURED) return; flushing = true;
  let sent = 0;
  try {
    while (true){
      const q = queue(); if (!q.length) break;
      const o = q[0];
      try { await runOp(o); sent++; }
      catch (e){
        if (isNetErr(e)){ if (o.tid === S.tripId) S.offline = true; break; }
        console.error(e); toast("One change couldn't be saved and was skipped.");
      }
      saveQueue(queue().filter(x => x.qid !== o.qid));
    }
  } finally { flushing = false; }
  if (sent){ ping(); if (S.tripId) await loadTrip(true); }
  else if (S.tripId){ compose(); render(); }
}
// Save changes: shown immediately, sent now or when back online.
function write(ops, okMsg, log){
  if (!S.tripId && !ops.length) return false;
  const list = ops.filter(Boolean).map(o => ({...o, qid:newId(10)}));
  if (log) list.push({...logOp(log[0], log[1], log[2]), qid:newId(10)});
  saveQueue([...queue(), ...list]);
  compose(); render();
  if (okMsg) toast(navigator.onLine === false ? okMsg + " (saved offline)" : okMsg);
  flush();
  return true;
}

function diffText(t, a, b){
  const ch = [], nm = id => person(t, id).name, sh = e => JSON.stringify(Object.entries(e.shares||{}).map(([k, v]) => [k, round(v, 4)]).sort());
  if (round(a.amount, 4) !== round(b.amount, 4)) ch.push(`amount ${fmt(a.amount, t.currency)} → ${fmt(b.amount, t.currency)}`);
  if ((a.cur || t.currency) !== b.cur || round(a.origAmount ?? a.amount, 4) !== round(b.origAmount, 4)) { if ((a.cur || t.currency) !== t.currency || b.cur !== t.currency) ch.push(`original ${fmt(a.origAmount ?? a.amount, a.cur || t.currency)} → ${fmt(b.origAmount, b.cur)}`); }
  if ((a.desc||"") !== (b.desc||"")) ch.push(`name “${a.desc || "—"}” → “${b.desc || "—"}”`);
  if (a.payer !== b.payer) ch.push(`paid by ${nm(a.payer)} → ${nm(b.payer)}`);
  if ((a.method||"") !== (b.method||"")) ch.push(`method ${a.method || "—"} → ${b.method || "—"}`);
  if ((a.date||"") !== (b.date||"")) ch.push(`date ${niceDate(a.date)} → ${niceDate(b.date)}`);
  if (a.type !== "settle" && (a.cat||"") !== (b.cat||"")) ch.push(`category ${cat(a.cat).l} → ${cat(b.cat).l}`);
  if (sh(a) !== sh(b) && round(a.amount, 4) === round(b.amount, 4)) ch.push("who shares it");
  if ((a.notes||"") !== (b.notes||"")) ch.push("the note");
  if ((a.place||"") !== (b.place||"")) ch.push(`place ${a.place || "—"} → ${b.place || "—"}`);
  if ((a.days||1) !== (b.days||1)) ch.push(`spread ${a.days||1} → ${b.days||1} days`);
  if ((a.mode === "personal") !== (b.mode === "personal")) ch.push(b.mode === "personal" ? "made it personal" : "made it shared");
  if ((a.receipt||null) !== (b.receipt||null)) ch.push(b.receipt ? "added a receipt" : "removed the receipt");
  return ch;
}

/* ---------- money math ---------- */
// Split `total` (integer minor units) in proportion to weights, largest remainder so it always sums exactly.
function allocate(total, w){
  const ids = Object.keys(w).filter(k => w[k] > 0), sumW = ids.reduce((s,k) => s + w[k], 0), out = {};
  if (!ids.length || sumW <= 0) return out;
  let used = 0; const fr = [];
  ids.forEach(k => { const raw = total * w[k] / sumW, fl = Math.floor(raw); out[k] = fl; used += fl; fr.push([k, raw - fl]); });
  fr.sort((a,b) => b[1]-a[1]); for (let i = 0; i < total - used; i++) out[fr[i % fr.length][0]]++;
  return out;
}
function calcSplit(d, t){
  const fE = 10 ** decimals(d.cur), fT = 10 ** decimals(t.currency);
  const amt = parseAmt(d.amount), totalE = Math.round(amt * fE);
  const rate = d.cur === t.currency ? 1 : parseAmt(d.rate);
  const totalT = Math.round(amt * rate * fT);
  const ids = (t.people||[]).map(p => p.id), w = {}; let err = "", status = "";
  if (d.mode === "equal"){
    d.among.forEach(id => { if (ids.includes(id)) w[id] = 1; });
    const n = Object.keys(w).length; if (!n) err = "Pick at least one person to split with."; else status = n === 1 ? "One person pays it all" : `${n}-way split`;
  } else if (d.mode === "personal"){
    if (ids.includes(d.payer)){ w[d.payer] = 1; status = `Only ${person(t, d.payer).name} · not split with anyone`; } else err = "Pick who paid.";
  } else if (d.mode === "exact"){
    let sum = 0; ids.forEach(id => { const m = Math.round(parseAmt(d.exact[id]) * fE); if (m > 0){ w[id] = m; sum += m; } });
    const left = totalE - sum;
    if (!left) status = "Adds up perfectly ✔"; else err = left > 0 ? `${fmt(left/fE, d.cur)} left to assign` : `${fmt(-left/fE, d.cur)} over the total`;
  } else if (d.mode === "percent"){
    let sum = 0; ids.forEach(id => { const p = parseAmt(d.percent[id]); if (p > 0){ w[id] = p; sum += p; } });
    const left = round(100 - sum, 3);
    if (Math.abs(left) < 0.01) status = "100% ✔"; else err = left > 0 ? `${round(left,2)}% left to assign` : `${round(-left,2)}% too much`;
  } else if (d.mode === "shares"){
    let sum = 0; ids.forEach(id => { const p = parseAmt(d.shareN[id]); if (p > 0){ w[id] = p; sum += p; } });
    if (!sum) err = "Give at least one person a share."; else status = `${round(sum,2)} share${sum===1?"":"s"} in total`;
  } else if (d.mode === "items"){
    let sumI = 0;
    for (const it of d.items){ const m = Math.round(parseAmt(it.amount) * fE); if (m <= 0) continue;
      const ws = it.who.filter(id => ids.includes(id)); if (!ws.length){ err = `Pick who had “${it.name || "an item"}”.`; break; }
      sumI += m; ws.forEach(id => w[id] = (w[id]||0) + m / ws.length); }
    if (!err){
      if (!sumI) err = "Add at least one item with a price.";
      else if (sumI > totalE) err = `Items add up to ${fmt(sumI/fE, d.cur)}, more than the total.`;
      else { const rem = totalE - sumI; status = rem ? `Items ${fmt(sumI/fE, d.cur)} + ${fmt(rem/fE, d.cur)} tax/tip, shared in proportion` : "Items add up to the total ✔"; }
    }
  }
  return { err, status, prevE: allocate(totalE, w), sharesT: allocate(totalT, w), totalE, totalT, fE, fT, rate };
}
function balances(t, exps){
  const f = 10 ** decimals(t.currency), net = {};
  (t.people||[]).forEach(p => net[p.id] = 0);
  for (const e of exps){
    net[e.payer] = (net[e.payer]||0) + Math.round(e.amount * f);
    for (const [id, v] of Object.entries(e.shares||{})) net[id] = (net[id]||0) - Math.round(v * f);
  }
  return {net, f};
}
function settlePlan(net){
  const cred = [], debt = [];
  for (const [id, v] of Object.entries(net)){ if (v > 0) cred.push({id, v}); else if (v < 0) debt.push({id, v:-v}); }
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  const plan = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length){
    const m = Math.min(debt[i].v, cred[j].v);
    if (m > 0) plan.push({from:debt[i].id, to:cred[j].id, v:m});
    debt[i].v -= m; cred[j].v -= m;
    if (!debt[i].v) i++; if (!cred[j].v) j++;
  }
  return plan;
}
const MODE_LABEL = {exact:"exact split", percent:"split by %", shares:"split by shares", items:"itemized"};
function splitLabel(e){ if (e.mode === "personal") return "🔒 personal"; const n = Object.keys(e.shares||{}).length;
  return MODE_LABEL[e.mode] ? `${MODE_LABEL[e.mode]} · ${n} ${n===1?"person":"people"}` : `split ${n} way${n===1?"":"s"}`; }

function tripDayLabel(t){
  if (!t.start) return "";
  const td = today(), total = t.end ? dayDiff(t.start, t.end) + 1 : 0;

  const d = draft; if (!d || d.kind !== "look") return;
  const q = (d.q || "").trim(); if (!q){ d.status = "Type a place to search."; return renderLookSheet(); }
  if (navigator.onLine === false){ d.status = "Finding photos needs internet."; return renderLookSheet(); }

  try { const r = await findPhotos(q); if (draft !== d) return; d.results = r; d.status = r.length ? "" : `No good photos found for “${q}”. Try a city or landmark name.`; }

// Today's exchange rate from a free rates service (mid-market, updated daily), cached for the day.
async function liveRate(from, to){
  const key = "ww-fx-" + from; let c = null; try { c = JSON.parse(lsGet(key) || "null"); } catch {}
  if (c && c.day === today() && c.rates && c.rates[to]) return {rate:c.rates[to]};
  try {
    const r = await fetch("https://open.er-api.com/v6/latest/" + encodeURIComponent(from)), j = await r.json();
    if (j.result !== "success" || !j.rates) throw new Error("no rates");
    lsSet(key, JSON.stringify({day:today(), rates:j.rates}));
    return j.rates[to] ? {rate:j.rates[to]} : null;
  } catch { return c && c.rates && c.rates[to] ? {rate:c.rates[to], stale:true} : null; }
}
function autoRate(){
  const t = trip(), d = draft; if (!t || !d || d.kind !== "exp" || d.type === "settle" || d.cur === t.currency || d.rateTyped) return;
  const my = d, cur = d.cur;
  liveRate(cur, t.currency).then(res => {
    if (!res || draft !== my || my.cur !== cur || my.rateTyped) return;
    my.rate = String(+res.rate.toPrecision(6)); my.rateSrc = res.stale ? "last known rate" : "today's rate";
    const i = $("#exp-rate"); if (i) i.value = my.rate;
    const c = $("#conv-line"); if (c) c.textContent = convLine(); refreshSplit();
  });
}
function splitSummary(){
  const t = trip(), d = draft, r = calcSplit(d, t);
  if (r.err) return {text:"⚠️ " + r.err, bad:true};
  const n = Object.keys(r.prevE).length, names = {equal:"Equal", exact:"Exact amounts", percent:"By %", shares:"By shares", items:"Itemized"};
  const days = (d.days || 1) > 1 ? ` · ${d.days} days` : "";
  if (d.mode === "personal") return {text:`🔒 Personal · ${person(t, d.payer).name} only${days}`, bad:false};
  return {text:`${names[d.mode]} · ${n} ${n===1?"person":"people"}${days}`, bad:false};
}

function refreshSplit(){

  box.querySelectorAll("[data-prev]").forEach(el => { const v = r.prevE[el.dataset.prev]; el.textContent = v ? fmt(v/r.fE, draft.cur) : ""; });
}
function prefillMode(mode){
  const t = trip(), d = draft, ids = (t.people||[]).map(p=>p.id), base = [...d.among].filter(id => ids.includes(id));
  const among = base.length ? base : ids;
  if (mode === "exact" && !Object.values(d.exact).some(v => parseAmt(v))){
    const r = calcSplit({...d, mode:"equal", among:new Set(among)}, t); d.exact = {};
    for (const [id, v] of Object.entries(r.prevE)) d.exact[id] = String(v / r.fE);
  }
  if (mode === "percent" && !Object.values(d.percent).some(v => parseAmt(v))){
    d.percent = {}; const n = among.length, each = Math.floor(10000 / n) / 100;
    among.forEach((id, i) => d.percent[id] = String(i === n-1 ? round(100 - each*(n-1), 2) : each));
  }
  if (mode === "shares" && !Object.values(d.shareN).some(v => parseAmt(v))){ d.shareN = {}; among.forEach(id => d.shareN[id] = "1"); }
  if (mode === "items" && !d.items.length) d.items = [{name:"", amount:"", who:[...ids]}];
}

/* ---------- receipts ---------- */
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    return blob || file;
  } catch { return file; }
}
async function uploadCover(file){
  const d = draft; if (!file || !d || d.kind !== "look") return;
  if (navigator.onLine === false) return toast("Uploading a photo needs internet.");
  d.uploading = true; d.status = "Uploading your photo…"; renderLookSheet();
  try {
    const blob = await shrink(file), path = `${S.tripId}/cover-${newId(12)}.jpg`;
    check(await sb(S.tripId).storage.from("receipts").upload(path, blob, {contentType:"image/jpeg", upsert:false}));
    const url = sb(S.tripId).storage.from("receipts").getPublicUrl(path).data.publicUrl;
    d.cover = {type:"upload", url, thumb:url, credit:"", link:"", q:d.q}; d.status = "";
  } catch (e){ console.error(e); d.status = "Couldn't upload the photo. Check your connection."; }
  d.uploading = false; if (draft === d) renderLookSheet();
}
async function onReceiptFile(file){
  if (!file || !draft) return;
  if (navigator.onLine === false) return toast("Photos need internet. Save the expense now and add the photo later.");
  syncExpDraft();
  const my = draft, blob = await shrink(file);
  if (my.receiptUrl && my.receiptUrl.startsWith("blob:")) URL.revokeObjectURL(my.receiptUrl);
  my.receiptUrl = URL.createObjectURL(blob); my.receipt = null; my.uploading = true;
  if (draft === my) renderExpenseSheet();
  const type = ["image/jpeg","image/png","image/webp"].includes(blob.type) ? blob.type : "image/jpeg";
  const path = `${S.tripId}/${newId(16)}.${type.split("/")[1].replace("jpeg","jpg")}`;
  try { check(await sb(S.tripId).storage.from("receipts").upload(path, blob, {contentType:type, upsert:false})); my.receipt = path; }
  catch (e){ console.error(e); toast("Couldn't upload the photo. Check your connection."); }
  my.uploading = false; if (draft === my) renderExpenseSheet();
}

function buildCSV(t, exps){
  const q = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const people = t.people || [];
  const head = ["Date","Type","Description","Category","Paid by","Payment method",`Amount (${t.currency})`,"Original amount","Original currency","Exchange rate","Split type",...people.map(p => `${p.name} share (${t.currency})`),"Items","Notes","Place","Days","Personal","Receipt photo"];
  const rows = [...exps].sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0)).map(e => {
    const settle = e.type === "settle";
    return [e.date, settle ? "Pay-back" : "Expense", settle ? `${person(t,e.payer).name} paid back ${person(t, Object.keys(e.shares||{})[0]).name}` : e.desc, settle ? "" : cat(e.cat).l,
      person(t, e.payer).name, e.method, e.amount, e.origAmount ?? e.amount, e.cur || t.currency, e.rate ?? 1, settle ? "" : (e.mode || "equal"),
      ...people.map(p => (e.shares||{})[p.id] ?? ""), (e.inputs && e.inputs.items || []).map(i => `${i.name}: ${i.amount}`).join("; "), e.notes || "", e.place || "", e.days || 1, e.mode === "personal" ? "yes" : "", e.receipt ? receiptUrl(e.receipt) : ""];
  });
  return [head, ...rows].map(r => r.map(q).join(",")).join("\r\n");
}
function exportCSV(){
  const t = trip(), csv = buildCSV(t, S.expenses), name = (t.name.replace(/[^\w\- ]+/g, "").trim() || "trip") + " expenses.csv";
  const url = URL.createObjectURL(new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast("Exported 📄");
}
async function copyText(text, el){
  try { await navigator.clipboard.writeText(text); toast("Copied 📋"); }
  catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Copy it from here."); }
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/)[0] || "", delim = [",", ";", "\t"].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i+1] === "\n") i++; row.push(cell); cell = ""; if (row.some(c => c.trim())) rows.push(row); row = []; }
    else cell += ch;
  }
  row.push(cell); if (row.some(c => c.trim())) rows.push(row);
  return rows;
}
function guessCol(head, re, not){ return head.findIndex(h => re.test(h) && !(not && not.test(h))); }

  if (!file) return;
  if (file.size > 3e6) return toast("That file is too big (3 MB max).");
  const rows = parseCSV(await file.text()); if (rows.length < 2) return toast("No rows found. Is it a CSV file with a header row?");
  const head = rows[0].map(h => h.trim()), lc = head.map(h => h.toLowerCase());
  const own = lc.findIndex(h => /^amount \([a-z]{3}\)$/.test(h));
  const map = {
    date: guessCol(lc, /date|time/), desc: guessCol(lc, /desc|name|merchant|item|detail|payee|narrative|what/),
    amount: own >= 0 ? own : guessCol(lc, /amount|total|price|cost|debit|value|spent/, /original|share/),
    cur: own >= 0 ? -1 : guessCol(lc, /^currency$|^cur$|ccy/), payer: guessCol(lc, /paid by|payer|who paid|^who$/),
    cat: guessCol(lc, /categ/), method: guessCol(lc, /method|payment|card|account/), notes: guessCol(lc, /note|memo|comment/),
    place: guessCol(lc, /place|location|city/), type: guessCol(lc, /^type$/),
  };
  for (const k in map) map[k] = String(map[k]);
  draft = { kind:"import", name:file.name, head, rows:rows.slice(1, 1001), map, fixedCur: own >= 0 ? head[own].match(/\(([A-Za-z]{3})\)/)[1].toUpperCase() : "",
    dateFmt:"auto", payer:me() || ((trip().people||[])[0] || {}).id, split:"equal" };
  renderImportSheet();
}

  ["groceries",/mart|market|grocer|7-?eleven|seven ?eleven|supermarket|family ?mart|lotus|tesco|aeon|big c/],["drinks",/\bbar\b|pub|beer|wine|drink|starbucks|coffee|cafe|kopi|boba|tea/],
  ["food",/restaurant|food|meal|lunch|dinner|breakfast|kfc|mcdonald|burger|pizza|noodle|rice|sushi|eat/],["fun",/ticket|tour|museum|park|cinema|show|spa|klook/],["shopping",/shop|store|mall|amazon|lazada|shopee|uniqlo/]];

  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  const D = '"Bricolage Grotesque", "Trebuchet MS", sans-serif', B = 'Figtree, system-ui, sans-serif';
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#1B2350"); g.addColorStop(1, "#0B1020"); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = "#FFC83D"; x.beginPath(); x.arc(W - 60, 80, 190, 0, Math.PI * 2); x.fill();
  const rr = (X, Y, w, h, r, fill) => { x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, r) : x.rect(X, Y, w, h); x.fillStyle = fill; x.fill(); };
  const fit = (txt, font, size, maxW) => { let s = size; do { x.font = `800 ${s}px ${font}`; s -= 2; } while (x.measureText(txt).width > maxW && s > 24); };
  const exps = S.expenses, real = exps.filter(isShared), total = real.reduce((a, e) => a + e.amount, 0);
  const {net, f} = balances(t, exps), plan = settlePlan(net);
  try { const img = new Image(); img.src = "icon.svg"; await img.decode(); x.drawImage(img, 70, 70, 84, 84); } catch {}
  x.fillStyle = "#EEF1FA"; x.font = `700 34px ${B}`; x.fillText("Wander Wallet", 172, 126);
  fit(`${t.emoji || "✈️"} ${t.name}`, D, 76, W - 140); x.fillStyle = "#FFFFFF"; x.fillText(`${t.emoji || "✈️"} ${t.name}`, 70, 260);
  const sub = [t.start ? (niceDate(t.start) + (t.end ? " – " + niceDate(t.end) : "")) : "", `${real.length} expenses`, `${(t.people||[]).length} travellers`].filter(Boolean).join("  ·  ");
  x.font = `500 32px ${B}`; x.fillStyle = "#97A0BE"; x.fillText(sub, 70, 315);
  rr(70, 360, W - 140, 200, 36, tripColor(t));
  x.fillStyle = "rgba(255,255,255,.8)"; x.font = `600 30px ${B}`; x.fillText("Total spent", 110, 420);
  fit(fmt(total, t.currency), D, 96, W - 220); x.fillStyle = "#FFFFFF"; x.fillText(fmt(total, t.currency), 110, 515);
  let y = 620; x.fillStyle = "#97A0BE"; x.font = `700 26px ${B}`; x.fillText("WHO PAID · WHO OWES", 70, y); y += 26;
  const paid = {}; real.forEach(e => paid[e.payer] = (paid[e.payer] || 0) + e.amount);
  for (const p of (t.people || []).slice(0, 5)){
    y += 82; x.fillStyle = p.color || "#D7DDEC"; x.beginPath(); x.arc(110, y - 18, 34, 0, Math.PI * 2); x.fill();
    x.font = `36px ${B}`; x.textAlign = "center"; x.fillStyle = "#000"; x.fillText(p.emoji, 110, y - 5); x.textAlign = "left";
    x.fillStyle = "#EEF1FA"; x.font = `700 34px ${B}`; x.fillText(p.name, 166, y - 22);
    x.fillStyle = "#97A0BE"; x.font = `500 26px ${B}`; x.fillText(`paid ${fmt(paid[p.id] || 0, t.currency)}`, 166, y + 12);
    const v = (net[p.id] || 0) / f; x.textAlign = "right"; x.font = `800 34px ${D}`;
    x.fillStyle = v > 0.0001 ? "#3FCB8F" : v < -0.0001 ? "#FF6F7D" : "#97A0BE";
    x.fillText(v > 0.0001 ? `gets ${fmt(v, t.currency)}` : v < -0.0001 ? `owes ${fmt(-v, t.currency)}` : "square", W - 70, y - 8); x.textAlign = "left";
  }
  y += 70; x.fillStyle = "#97A0BE"; x.font = `700 26px ${B}`; x.fillText("SETTLE UP", 70, y);
  x.font = `600 32px ${B}`; x.fillStyle = "#EEF1FA";
  if (!plan.length){ y += 52; x.fillText("Everyone's square 🎉", 70, y); }
  for (const s2 of plan.slice(0, 3)){ y += 52; x.fillText(`${person(t, s2.from).name} → ${person(t, s2.to).name}   ${fmt(s2.v / f, t.currency)}`, 70, y); }
  const cats = {}; real.forEach(e => cats[e.cat] = (cats[e.cat] || 0) + e.amount);
  const top = Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 3);
  let cx = 70; const cy = H - 120; x.font = `700 28px ${B}`;
  for (const [k, v] of top){ const label = `${cat(k).e} ${cat(k).l} ${Math.round(v / total * 100)}%`, w = x.measureText(label).width + 44;
    rr(cx, cy - 42, w, 60, 30, "#212944"); x.fillStyle = "#EEF1FA"; x.fillText(label, cx + 22, cy - 2); cx += w + 14; }
  x.fillStyle = "#5C6488"; x.font = `500 24px ${B}`; x.fillText("Tracked with Wander Wallet", 70, H - 36);
  const blob = await new Promise(r => c.toBlob(r, "image/png")); if (!blob) return toast("Couldn't make the image.");
  const file = new File([blob], `${(t.name || "trip").replace(/[^\w\- ]+/g, "").trim() || "trip"} summary.png`, {type:"image/png"});
  const url = URL.createObjectURL(blob), canShare = !!(navigator.canShare && navigator.canShare({files:[file]}));
  draft = {kind:"summary", file, url};
  openSheet(`<div class="xs-head"><h2 class="grow">Trip summary 📸</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <img src="${url}" alt="Trip summary" style="width:100%;border-radius:16px;display:block">
    <p class="note muted">Tip: long-press the picture to save it to Photos.</p>
    <div class="stack" style="gap:8px">${canShare ? `<button type="button" class="btn primary block" data-act="summary-share">Share…</button>` : ""}
      <a class="btn ${canShare ? "ghost" : "primary"} block" href="${url}" download="${esc(file.name)}">Download picture</a></div>`);
}

/* ---------- confetti ---------- */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false; const x = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#FFC83D","#3A4BF2","#FF8FA3","#4CD39A","#8B96FF","#FFB4A2"];
  const ps = Array.from({length:90}, () => ({x:W/2, y:H*0.85, vx:(Math.random()-.5)*14, vy:-(Math.random()*14+8), r:Math.random()*6+4, c:cols[Math.random()*cols.length|0], a:Math.random()*6, s:(Math.random()-.5)*.4}));
  let n = 0;
  (function tick(){ x.clearRect(0,0,W,H);
    ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += p.s; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if (++n < 90) requestAnimationFrame(tick); else { x.clearRect(0,0,W,H); c.hidden = true; } })();
}

/* ---------- automatic updates ---------- */
// Phones (including Home Screen apps) check the live copy whenever the app opens or comes back to the front.
// If it has a newer APP_VERSION, the app reloads into it, once unsaved work is out of the way.
async function applyUpdate(){
  try { const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : []; for (const r of regs) await r.update().catch(() => {});
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch {}
  location.replace(location.pathname + "?v=" + Date.now() + location.hash);
}
let updateReady = "", lastCheck = 0;
async function checkForUpdate(){
  if (navigator.onLine === false || Date.now() - lastCheck < 60000) return; lastCheck = Date.now();
  try {
    const html = await (await fetch("index.html?check=" + Date.now(), {cache:"no-store"})).text();
    const m = html.match(/const APP_VERSION = "([^"]+)"/); if (!m || m[1] === APP_VERSION) return;
    const tried = sessionStorage.getItem("ww-update-tried");
    if (tried === m[1]) return showUpdateBar(m[1]);           // already reloaded once for this version: don't loop
    if (draft || queue().length) return showUpdateBar(m[1]);   // a form is open or changes are still syncing
    sessionStorage.setItem("ww-update-tried", m[1]); applyUpdate();
  } catch {}
}
function showUpdateBar(v){
  if (updateReady === v) return; updateReady = v;
  const bar = document.createElement("div"); bar.className = "update-bar";
  bar.innerHTML = `<span>✨ A new version is ready</span><button class="btn sm sun" data-act="force-update">Update</button>`;
  document.body.appendChild(bar);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
setInterval(checkForUpdate, 30 * 60000);
setTimeout(checkForUpdate, 3000);

readHash(); render(); flush();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
