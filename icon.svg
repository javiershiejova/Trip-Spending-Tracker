<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5566FF"/>
      <stop offset="1" stop-color="#2B37D4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD966"/>
      <stop offset="1" stop-color="#FFB524"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- dotted flight path + little plane -->
    <path d="M60 230 C 60 140, 130 84, 210 78" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 24"/>
    <g transform="translate(244 74) rotate(-8) scale(.7)" fill="#FFFFFF">
      <rect x="-44" y="-10" width="88" height="20" rx="10"/>
      <path d="M-8 -6 L-30 -50 h18 L22 -6 Z M-8 6 L-30 50 h18 L22 6 Z M-38 -4 L-52 -24 h12 L-24 -4 Z M-38 4 L-52 24 h12 L-24 4 Z"/>
    </g>

    <!-- receipt tucked behind the suitcase: tracking the spending -->
    <g transform="rotate(14 360 170)">
      <path d="M306 96 h104 q14 0 14 14 v150 h-132 v-150 q0 -14 14 -14 z" fill="#FFFFFF"/>
      <rect x="318" y="118" width="80" height="12" rx="6" fill="#D6DCF5"/>
      <rect x="318" y="142" width="58" height="12" rx="6" fill="#D6DCF5"/>
      <rect x="318" y="166" width="70" height="12" rx="6" fill="#D6DCF5"/>
      <rect x="318" y="192" width="44" height="14" rx="7" fill="#FF9EB1"/>
    </g>

    <!-- suitcase handle -->
    <path d="M206 196 v-26 q0 -22 22 -22 h56 q22 0 22 22 v26" fill="none" stroke="#17203B" stroke-width="18" stroke-linecap="round"/>
    <!-- suitcase body -->
    <rect x="110" y="186" width="292" height="236" rx="52" fill="url(#gold)"/>
    <rect x="164" y="186" width="24" height="236" fill="#F2A614" opacity=".55"/>
    <rect x="324" y="186" width="24" height="236" fill="#F2A614" opacity=".55"/>
    <!-- wheels -->
    <circle cx="176" cy="432" r="16" fill="#17203B"/>
    <circle cx="336" cy="432" r="16" fill="#17203B"/>

    <!-- happy face -->
    <ellipse cx="222" cy="294" rx="15" ry="19" fill="#17203B"/>
    <ellipse cx="290" cy="294" rx="15" ry="19" fill="#17203B"/>
    <circle cx="228" cy="287" r="5.5" fill="#FFFFFF"/>
    <circle cx="296" cy="287" r="5.5" fill="#FFFFFF"/>
    <ellipse cx="196" cy="330" rx="19" ry="11" fill="#FF8FA3" opacity=".85"/>
    <ellipse cx="316" cy="330" rx="19" ry="11" fill="#FF8FA3" opacity=".85"/>
    <path d="M236 326 q20 24 40 0" fill="none" stroke="#17203B" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
